services:
  postgres_service:
    container_name: "training_postgres"
    image: postgres:14
    networks:
      - training_network
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    command: alembic upgrade head
    build:
      context:
        .
    env_file:
      - .env
    networks:
      - training_network
    depends_on:
      - postgres_service

  training_back_service:
    container_name: "training_back"
    build:
      context: .
    networks:
      - training_network
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - migrate

networks:
  training_network:

volumes:
  postgres_data: